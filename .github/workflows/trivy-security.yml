name: Trivy Security Scan

on:
  push:
    branches:
      - develop

permissions:
  security-events: write
  contents: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t as241s5_aej_29-be .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.70.0

      # ── Scan: reporte nativo Trivy con Total al final ─────────────────────
      - name: Run Trivy Scanner
        run: |
          trivy image \
            --format table \
            --ignore-unfixed \
            --pkg-types library \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 0 \
            as241s5_aej_29-be

      # ── Genera SARIF completo (OS + library) para GitHub Security tab ──────
      - name: Generate SARIF report
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --quiet \
            as241s5_aej_29-be

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
