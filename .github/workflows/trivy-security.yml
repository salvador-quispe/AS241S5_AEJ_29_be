name: Trivy Security Scan

on:
  push:
    branches:
      - develop

permissions:
  security-events: write
  contents: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t as241s5_aej_29-be .

      # ── Scan 1: tabla legible en los logs ──────────────────────────────────
      # ignore-unfixed: true → solo falla si el CVE tiene parche disponible
      # severity: todas las escalas → reporte completo sin omitir nada
      - name: Run Trivy Scanner (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'as241s5_aej_29-be'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          trivyignores: '.trivyignore'

      # ── Scan 2: reporte SARIF para GitHub Security tab ────────────────────
      - name: Run Trivy Scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: 'as241s5_aej_29-be'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          trivyignores: '.trivyignore'

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
