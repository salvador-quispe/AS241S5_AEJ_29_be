apiVersion: apps/v1
kind: Deployment
metadata:
  name: salvador-quispe-29-deployment
  namespace: salvador-quispe-29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salvador-quispe-29-app
  template:
    metadata:
      labels:
        app: salvador-quispe-29-app
    spec:
      containers:
        - name: salvador-quispe-29-container
          image: salvaqc/salvador-quispe-genvideo:latest
          ports:
            - containerPort: 8080
          env:
            - name: R2DBC_URL
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: DB_PASSWORD
            - name: RAPIDAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: RAPIDAPI_KEY
            - name: RAPIDAPI_TTS_HOST
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: RAPIDAPI_TTS_HOST
            - name: RAPIDAPI_TTS_URL
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: RAPIDAPI_TTS_URL
            - name: RAPIDAPI_EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: RAPIDAPI_EMAIL_HOST
            - name: RAPIDAPI_EMAIL_URL
              valueFrom:
                secretKeyRef:
                  name: salvador-quispe-29-secret
                  key: RAPIDAPI_EMAIL_URL
